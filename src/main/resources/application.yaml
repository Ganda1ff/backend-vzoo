spring:
  main:
    banner-mode: off
  application:
    name: vzoo-server
  datasource:
    url: jdbc:h2:file:./data/vzoo;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    ru.ulstu.is.server.*: DEBUG

springdoc:
  open-api:
    info:
      title: V-ZOO REST API
      description: REST API for V-ZOO laboratory work 3 (multilayer architecture)
      version: 3.0.0
